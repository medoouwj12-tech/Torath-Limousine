<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>معاينة ودراسة صور الأسطول الـ 27</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #fff; padding: 20px; }
    h1 { text-align: center; color: #D4AF37; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #222; border: 2px solid #444; border-radius: 12px; padding: 15px; }
    .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; }
    .title { color: #FFD700; font-size: 1.1rem; margin: 10px 0 5px 0; font-weight: bold; }
    .num { background: #D4AF37; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>معاينة صور الأسطول الـ 27 الحقيقية (Torath Limousine Fleet Inspection)</h1>
  <div class="grid" id="grid"></div>

  <script src="assets/js/cars-data.js"></script>
  <script>
    const files = [
      "WhatsApp Image 2026-07-29 at 7.02.32 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.33 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.33 PM (2).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.33 PM (3).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.33 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.34 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.34 PM (2).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.34 PM (3).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.34 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.35 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.35 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.36 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.36 PM (2).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.36 PM (3).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.36 PM (4).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.36 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.37 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.37 PM (2).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.37 PM (3).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.37 PM (4).jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.37 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.02.38 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.04.00 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.04.00 PM (2).jpeg",
      "WhatsApp Image 2026-07-29 at 7.04.00 PM.jpeg",
      "WhatsApp Image 2026-07-29 at 7.04.01 PM (1).jpeg",
      "WhatsApp Image 2026-07-29 at 7.04.01 PM.jpeg"
    ];

    const grid = document.getElementById('grid');
    grid.innerHTML = files.map((f, i) => `
      <div class="card">
        <div><span class="num">الصورة #${i+1}</span></div>
        <img src="${f}" alt="${f}">
        <div class="title">${f}</div>
      </div>
    `).join('');
  </script>
</body>
</html>
